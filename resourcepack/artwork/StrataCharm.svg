<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#8a3ffc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8a3ffc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="35%" stop-color="#f7c948"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#f7d774"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9a520"/>
      <stop offset="100%" stop-color="#7a5407"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#7b3fd1"/>
      <stop offset="60%" stop-color="#3a1670"/>
      <stop offset="100%" stop-color="#1a0a35"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b9ab3"/>
      <stop offset="45%" stop-color="#f6f9fd"/>
      <stop offset="100%" stop-color="#7d8ca6"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b1150"/>
      <stop offset="50%" stop-color="#5a2d99"/>
      <stop offset="100%" stop-color="#2b1150"/>
    </linearGradient>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9cff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c04bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="swordShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <path id="spark" d="M0,-1 Q0.08,-0.08 1,0 Q0.08,0.08 0,1 Q-0.08,0.08 -1,0 Q-0.08,-0.08 0,-1Z"/>
    <g id="sword">
      <polygon points="0,-158 17,-124 17,34 -17,34 -17,-124" fill="url(#steel)" stroke="#5b6a83" stroke-width="2"/>
      <rect x="-3.5" y="-118" width="7" height="146" fill="#8393ad" opacity="0.75"/>
      <rect x="-50" y="34" width="100" height="17" rx="8" fill="url(#gold)" stroke="#7a5407" stroke-width="2"/>
      <circle cx="-50" cy="42.5" r="9" fill="#f7c948" stroke="#7a5407" stroke-width="2"/>
      <circle cx="50" cy="42.5" r="9" fill="#f7c948" stroke="#7a5407" stroke-width="2"/>
      <rect x="-9" y="51" width="18" height="54" rx="4" fill="url(#grip)" stroke="#1a0a35" stroke-width="2"/>
      <rect x="-9" y="62" width="18" height="4" fill="#f7c948"/>
      <rect x="-9" y="76" width="18" height="4" fill="#f7c948"/>
      <rect x="-9" y="90" width="18" height="4" fill="#f7c948"/>
      <circle cx="0" cy="116" r="14" fill="url(#gold)" stroke="#7a5407" stroke-width="2"/>
    </g>
  </defs>

  <!--BG-->

  <circle cx="400" cy="440" r="380" fill="url(#aura)"/>

  <g filter="url(#shadow)">
    <!-- chain loop -->
    <circle cx="400" cy="150" r="34" fill="none" stroke="url(#goldDark)" stroke-width="14"/>
    <circle cx="400" cy="150" r="34" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <rect x="384" y="176" width="32" height="46" rx="8" fill="url(#gold)" stroke="#7a5407" stroke-width="2"/>

    <!-- medallion -->
    <circle cx="400" cy="440" r="232" fill="url(#gold)" stroke="#7a5407" stroke-width="3"/>
    <circle cx="400" cy="440" r="202" fill="url(#goldDark)"/>
    <circle cx="400" cy="440" r="196" fill="url(#gold)"/>
  </g>

  <!-- ring studs -->
  <g transform="translate(400 440)" fill="#fff8d6" stroke="#8a6410" stroke-width="2">
    <g transform="rotate(0)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(22.5)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(45)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(67.5)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(90)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(112.5)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(135)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(157.5)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(180)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(202.5)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(225)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(247.5)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(270)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(292.5)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(315)"><circle cx="0" cy="-214" r="7"/></g>
    <g transform="rotate(337.5)"><circle cx="0" cy="-214" r="7"/></g>
  </g>

  <!-- purple disc -->
  <circle cx="400" cy="440" r="178" fill="url(#disc)" stroke="#5a2d99" stroke-width="3"/>
  <g transform="translate(400 440)" fill="#ffffff" opacity="0.07">
    <polygon points="0,0 -22,-178 22,-178"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(30)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(60)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(90)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(120)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(150)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(180)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(210)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(240)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(270)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(300)"/>
    <polygon points="0,0 -22,-178 22,-178" transform="rotate(330)"/>
  </g>
  <circle cx="400" cy="440" r="164" fill="none" stroke="#f7c948" stroke-width="2" stroke-dasharray="3 9" opacity="0.7"/>

  <circle cx="400" cy="440" r="110" fill="url(#gemGlow)" opacity="0.55" filter="url(#soft)"/>

  <!-- crossed swords -->
  <g transform="translate(400 440) scale(1.05)">
    <use href="#sword" transform="rotate(-38)" filter="url(#swordShadow)"/>
    <use href="#sword" transform="rotate(38)" filter="url(#swordShadow)"/>
  </g>

  <!-- gem -->
  <g transform="translate(400 440) scale(0.85)" filter="url(#swordShadow)">
    <polygon points="0,-62 46,-32 46,32 0,62 -46,32 -46,-32" fill="#7a1fc2" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
    <polygon points="0,-62 46,-32 0,0" fill="#ffc2ff"/>
    <polygon points="46,-32 46,32 0,0" fill="#e07cff"/>
    <polygon points="46,32 0,62 0,0" fill="#a32ee0"/>
    <polygon points="0,62 -46,32 0,0" fill="#8a22c9"/>
    <polygon points="-46,32 -46,-32 0,0" fill="#c95cff"/>
    <polygon points="-46,-32 0,-62 0,0" fill="#f2a0ff"/>
    <polygon points="0,-62 46,-32 46,32 0,62 -46,32 -46,-32" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <ellipse cx="-16" cy="-30" rx="10" ry="18" fill="#ffffff" opacity="0.85" transform="rotate(35 -16 -30)"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff8d6" filter="url(#soft)" opacity="0.9">
    <use href="#spark" transform="translate(140 190) scale(30)"/>
    <use href="#spark" transform="translate(670 230) scale(24)"/>
    <use href="#spark" transform="translate(700 560) scale(34)"/>
    <use href="#spark" transform="translate(95 560) scale(22)"/>
    <use href="#spark" transform="translate(585 720) scale(20)"/>
    <use href="#spark" transform="translate(215 715) scale(26)"/>
  </g>
  <g fill="#ffffff">
    <use href="#spark" transform="translate(140 190) scale(26)"/>
    <use href="#spark" transform="translate(670 230) scale(20)"/>
    <use href="#spark" transform="translate(700 560) scale(30)"/>
    <use href="#spark" transform="translate(95 560) scale(18)"/>
    <use href="#spark" transform="translate(585 720) scale(16)"/>
    <use href="#spark" transform="translate(215 715) scale(22)"/>
    <circle cx="255" cy="130" r="4"/><circle cx="560" cy="110" r="3"/><circle cx="740" cy="380" r="4"/>
    <circle cx="60" cy="380" r="3"/><circle cx="430" cy="760" r="4"/>
  </g>
</svg>
