# how many stratas to award per vote
reward-amount: 500

# Stratas are awarded through the StrataEconomy API; this avoids building a console
# command from a username supplied by a vote listing.

# optional: also hand a CrazyCrates key to whoever votes. Leave crate blank to disable.
vote-key:
  enabled: true
  # virtual or physical - matches the type argument on /crates give
  type: virtual
  crate: VoteCrate
  amount: 1

# announce votes to the whole server
broadcast: true
broadcast-message: "&e%player% &fjust voted for the server and got &6%amount% Stratas&f! Vote at &bstratasmp.com/vote"

# periodic reminder broadcast telling players to go vote - only fires when
# someone's actually online, click the message in chat to open the link
reminder:
  enabled: true
  interval-minutes: 30
  message: "&e★ &fVote for StrataSMP and get &6500 Stratas per vote&f! &e★"
  link: "https://stratasmp.com/vote"

# a permanent LuckPerms suffix shown after the player's name (tab list, nametag and chat) after this vote total.
# Counting starts from the first vote after this feature went live.
voter-tag:
  enabled: true
  votes: 50
  broadcast-message: "&e%player% &fhas voted &6%votes% times &fand earned the &a&l[VOTER] &ftag!"
