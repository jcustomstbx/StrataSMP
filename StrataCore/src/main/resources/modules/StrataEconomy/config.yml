# StrataEconomy

database:
  host: "localhost"
  port: 3306
  name: "stratasmp"
  user: "stratasmp"
  password: "CHANGE_ME"          # set at deploy - do not commit the real value
  pool-size: 6
  # tables are created automatically: stratas_balances, stratas_auctions

currency:
  starting-balance: 0
  symbol: "♛"               # ♛
  name-singular: "Strata"
  name-plural: "Stratas"
  # how many real emeralds one Strata is "worth" for /shop reference only
  emerald-value: 30

vault:
  # register as the Vault economy provider. Leave true unless another plugin
  # should own the economy.
  register: true

migration:
  # on first start, import balances from RankEssentials/economy.yml if present.
  # runs once, then writes .migrated so it never repeats.
  from-rankessentials: true
  rankessentials-economy-file: "../RankEssentials/economy.yml"
  # also pull StratasPlugin/balances.yml if it still has entries
  stratasplugin-balances-file: "../StratasPlugin/balances.yml"

auction:
  max-listings-per-player: 5      # strataeconomy.admin bypasses
  listing-fee-percent: 0.0        # taken from the seller when listing
  min-price: 1
  max-price: 100000000
  expiry-days: 0                  # 0 = never expires
  # sale tax is applied by StrataElections via AuctionSaleEvent - not set here

buyorders:
  max-per-player: 5      # strataeconomy.admin bypasses
  max-amount: 2304        # per order, same cap as /shop buy
  min-price: 1
  max-price: 100000000

shop:
  # prices come from sections/*.yml. With sell-everything on, every item that has no sell price there is sold at a
  # small default (see DefaultSellPrices) so nothing is unsellable. Prices in the section files always win.
  sell-everything: true
  # Items crafted from planks (stairs, slabs, fences, doors, signs, boats, sticks, bowls, ladders) are not sold by default,
  # because one log makes several of them. Price one in sections/*.yml to allow it; a section price always wins.
  # materials that must never be sold, even if a section file prices them (e.g. [ELYTRA, BEACON]).
  # Shipped with the blocks and plants that can be farmed endlessly or automatically (stone generators, snow, dripstone,
  # sculk, saplings, leaves, flowers, grasses, vines, fungi, corals, seeds) so the 1-strata default can't be farmed.
  # Items you price yourself in sections/*.yml are not in this list; add them here to block them too.
  unsellable:
    - ACACIA_LEAVES
    - ACACIA_SAPLING
    - ALLIUM
    - AZALEA
    - AZALEA_LEAVES
    - AZURE_BLUET
    - BAMBOO_SAPLING
    - BEETROOT_SEEDS
    - BIG_DRIPLEAF
    - BIRCH_LEAVES
    - BIRCH_SAPLING
    - BLUE_ORCHID
    - BRAIN_CORAL
    - BRAIN_CORAL_BLOCK
    - BRAIN_CORAL_FAN
    - BRAIN_CORAL_WALL_FAN
    - BUBBLE_CORAL
    - BUBBLE_CORAL_BLOCK
    - BUBBLE_CORAL_FAN
    - BUBBLE_CORAL_WALL_FAN
    - BUSH
    - CACTUS_FLOWER
    - CHERRY_LEAVES
    - CHERRY_SAPLING
    - CLOSED_EYEBLOSSOM
    - COBBLESTONE
    - CORNFLOWER
    - CRIMSON_FUNGUS
    - CRIMSON_ROOTS
    - DANDELION
    - DARK_OAK_LEAVES
    - DARK_OAK_SAPLING
    - DEAD_BRAIN_CORAL
    - DEAD_BUBBLE_CORAL
    - DEAD_BUSH
    - DEAD_FIRE_CORAL
    - DEAD_HORN_CORAL
    - DEAD_TUBE_CORAL
    - DRIPSTONE_BLOCK
    - FERN
    - FIREFLY_BUSH
    - FIRE_CORAL
    - FIRE_CORAL_BLOCK
    - FIRE_CORAL_FAN
    - FIRE_CORAL_WALL_FAN
    - FLOWERING_AZALEA
    - FLOWERING_AZALEA_LEAVES
    - GLOW_LICHEN
    - HANGING_ROOTS
    - HORN_CORAL
    - HORN_CORAL_BLOCK
    - HORN_CORAL_FAN
    - HORN_CORAL_WALL_FAN
    - JUNGLE_LEAVES
    - JUNGLE_SAPLING
    - LARGE_FERN
    - LEAF_LITTER
    - LILAC
    - LILY_OF_THE_VALLEY
    - MANGROVE_LEAVES
    - MANGROVE_PROPAGULE
    - MANGROVE_ROOTS
    - MELON_SEEDS
    - MOSS_BLOCK
    - MOSS_CARPET
    - MUD
    - MUDDY_MANGROVE_ROOTS
    - NETHER_SPROUTS
    - OAK_LEAVES
    - OAK_SAPLING
    - OPEN_EYEBLOSSOM
    - ORANGE_TULIP
    - OXEYE_DAISY
