  sell-tax-percent: 0.0
  # console record of /sell, for spotting item duplication. A sale is logged when it pays at least
  # min-stratas or sells at least min-items of one item; a player selling hourly-warn-stratas or more
  # within an hour gets a warning line (0 turns that off). Defaults apply if these are missing.
  sell-log:
    min-stratas: 1000
    min-items: 640
    hourly-warn-stratas: 20000

# worlds where the shop/AH/buy-order menus refuse clicks, even if a player opened the
# menu elsewhere and then walked/teleported in with it still open. StrataHub's
# hub-command-block list stops the /shop, /sell and /ah commands themselves in these
# worlds - this is the belt-and-suspenders check for a menu that was already open.
restricted-worlds:
  - hub

autosave-seconds: 60
