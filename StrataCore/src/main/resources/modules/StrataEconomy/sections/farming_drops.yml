# Farming Drops - sellable and buyable. Buying is rate-limited per player per
# material (daily-limit, resets 24h after the first purchase in the window) so
# the shop can't be used to bulk-restock a farm instead of growing it. Values
# are a first pass at "quite low, like 3-5" - tune per item freely, or remove
# daily-limit on an item to make it unlimited.
sellable: true
buyable: true

items:
  NETHER_WART: { sell: 3, buy: 16, daily-limit: 5 }
  WHEAT: { sell: 2, buy: 10, daily-limit: 5 }
  CARROT: { sell: 2, buy: 10, daily-limit: 5 }
  BEETROOT: { sell: 2, buy: 10, daily-limit: 5 }
  POTATO: { sell: 2, buy: 10, daily-limit: 5 }
  PUMPKIN: { sell: 3, buy: 16, daily-limit: 3 }
  MELON: { sell: 3, buy: 16, daily-limit: 3 }
  MELON_SLICE: { sell: 1, buy: 6, daily-limit: 5 }
  SUGAR_CANE: { sell: 5, buy: 24, daily-limit: 5 }

