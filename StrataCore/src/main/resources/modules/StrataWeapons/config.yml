# Two independent spear tweaks - either can be on without the other.
#
# remove-attack-cooldown: true takes the vanilla jab (attack) cooldown off, so the swing bar refills instantly
# while a spear is held, via a temporary attack-speed bonus (SpearCooldownTask). Currently false - real
# vanilla jab timing.
#
# clear-lunge-cooldown: RankEssentials adds its own custom 15 second lockout after every Lunge swing on top
# of vanilla - that lockout is RankEssentials' own invention, not part of Minecraft itself. true bypasses it
# entirely (reflection call into RankEssentials, finished the instant it starts), leaving only vanilla's own
# kinetic-weapon charge-up delay - baked into the spear item, no plugin can touch it - as the sole limiter on
# how often Lunge can be used. This was tried throttled to a few seconds first (3s, then 10s), but any
# RankEssentials-side restriction at all isn't "Minecraft default" - request was explicitly for that, not a
# shorter throttle, so this is unconditional again: RankEssentials' 15s never even gets to start. Note this
# is exactly what originally let Lunge be chained into flying across the map (2026-09-22) - that was about
# chaining a zero-cooldown dash for fast travel, which is a separate concern from "is this vanilla or not";
# revisit if the same complaint resurfaces.
spear:
  remove-attack-cooldown: false
  clear-lunge-cooldown: true

# Armour skins: applied from /skins to any helmet, chestplate, leggings or boots (a set), or to a helmet only
# (a strata). Same unlock as the weapon skins - the strataskins.<key> permission, or StrataCharm.
#   type       set = item model + worn look for all four pieces, strata = a helmet-only hat
#   item-model set: the item model prefix, "<prefix>_helmet" / "_chestplate" / "_leggings" / "_boots" (resource pack items/)
#              strata: the exact item model id
#   equipment  set only: the worn armour look (resource pack equipment/ id). A strata has none - the client draws
#              its model on the head instead.
# Material, protection and enchantments are never changed, only the look.
armor-skins:
  dark_armor:
