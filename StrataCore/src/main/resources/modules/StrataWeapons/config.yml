# Each entry under weapons: is a key you give out with /givecw <key> <player>.
# custom-model-data has to match a model your resource pack actually defines,
# or the item just renders as a plain version of whatever material you picked.
#
# gradient is optional - two hex colors, the name fades letter-by-letter
# between them. Leave it out and display-name just uses "color" instead.
#
# aura-color is a single hex color for the ambient particle glow shown while
# a player holds this weapon - picked to match each blade's actual look
# in-game, not necessarily the gradient above (the gradient is themed on the
# hilt/name for a few of these, not the blade itself).
#
# No enchantments on any of these on purpose - players enchant them themselves,
# they're just paying for the look, not a free maxed-out weapon.

# Broadcast to the whole server whenever someone gets a kill with a catalog
# weapon. Every weapon owner gets default-format for free; the
# strataweapons.killmessage.use permission (sold separately, not
# bundled with the weapons themselves) lets a player override it with their
# own wording via /killmsg set - {killer}/{victim}/{weapon} are always
# substituted by the plugin itself, never typed directly, so a custom
# message can't be used to impersonate someone else's name.
kill-messages:
  enabled: true
  default-format: "{victim} was struck down by {killer}'s {weapon}!"
  # Raw template length cap, checked before {killer}/{victim}/{weapon} are
  # substituted in - keeps the broadcast readable, not a bandwidth concern.
  max-length: 80
  # Case-insensitive substring match against a player's submitted /killmsg set
  # text. This is a blunt first line of defense, not full moderation - staff
  # still have /killmsg clear <player> to shut down anything that slips past
  # it after the fact.
  blacklisted-words: []

