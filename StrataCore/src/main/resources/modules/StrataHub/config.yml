  entry: "&6Off to the SMP! &7Randomly teleporting you in..."
  first-entry: "&6Welcome to the SMP! &7Randomly teleporting you in..."
  returning: "&7Welcome back - teleporting you to where you left off."
  not-an-entry-npc: "&cThat NPC isn't set up as an SMP entry point."
  no-npc-selected: "&cSelect an NPC first (look at it and run /npc select, or right-click it while holding nothing)."
  entry-added: "&aNPC #%id% is now an SMP entry point."
  entry-removed: "&aNPC #%id% is no longer an SMP entry point."
  entry-list-header: "&6SMP entry NPCs:"
  entry-list-empty: "&7No SMP entry NPCs configured yet - select one with Citizens and run /stratahub addentry."
  closed-world: "&cThe End is closed for now - it opens when the time is right!"
  lockdown-blocked: "&cThe SMP is closed for a build event right now - stick around the hub!"
  comingsoon-added: "&aNPC #%id% now shows the coming-soon message."
  comingsoon-removed: "&aNPC #%id% no longer shows the coming-soon message."
  factions-coming-soon: "&6Factions &7is coming soon! Check back later."
  hub-command-blocked: "&cThat command is only available on the SMP, not here in the hub."
